<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Full-stack developer portfolio — building fast, interactive, and beautiful digital experiences." />
    <meta property="og:title" content="dread Dev — Portfolio" />
    <meta property="og:description" content="Full-stack developer specializing in modern web applications." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

    <script>
  const theme = localStorage.getItem("portfolio-theme");
  const themes = ["red", "green", "blue", "violet", "purple"];
  const selected = themes.includes(theme) ? theme : "red";

  document.documentElement.classList.add(`theme-${selected}`);
</script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-neutral-950 text-neutral-100">
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
